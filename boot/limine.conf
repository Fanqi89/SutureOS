# SutureOS Limine boot configuration
# Loaded by the Limine bootloader (BSD-2-Clause, see THIRD_PARTY_LICENSES.md)
# from /limine/limine.conf, /boot/limine/limine.conf, or /limine.conf on the ISO.
#
# Boot presentation (as requested): the FIRST thing on screen must be the
# scrolling English kernel log, followed by the system name banner and then a
# clean terminal.  Limine's own menu/logo/countdown would break that, so the
# menu is disabled: timeout 0 + default_entry 1 boots entry 1 immediately.
# (The verbose entry is kept as a second entry for debugging; it is no longer
# the default.)

timeout: 0
default_entry: 1
serial: yes

/SutureOS
    comment: SutureOS - a stitched-together hobby OS kernel (GPL-3.0)
    protocol: multiboot
    path: boot():/boot/kernel.elf

/SutureOS (verbose)
    comment: SutureOS - verbose boot with full self-test output
    protocol: multiboot
    path: boot():/boot/kernel.elf
    cmdline: verbose
